name: Prepara bozza della release beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepara-bozza-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bozza-release:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Crea la bozza, se non esiste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.9.0-beta" >/dev/null 2>&1; then
            echo "La release esiste già: nessuna modifica."
            exit 0
          fi
          gh release create "v0.9.0-beta" \
            --title "Normal Golf Game — Traduzione Italiana Beta 0.9" \
            --notes-file "release-notes/v0.9.0-beta.md" \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease
          echo "Bozza creata: aggiungere manualmente l'archivio ZIP verificato e pubblicare."
